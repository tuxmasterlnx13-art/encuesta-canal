# Guarda cada voto (un issue con título "[VOTO] ...") en data/votos.json,
# responde al issue y lo cierra. Si alguien vota otra vez, se reemplaza su voto anterior.
name: Registrar voto

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: votos
  cancel-in-progress: false

jobs:
  registrar:
    if: startsWith(github.event.issue.title, '[VOTO]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const VALID = {
              nicho: ["familia","trabajo","miedo","dinero","amor","barrio"],
              idioma: ["es","en","ambos"],
              plataforma: ["youtube","tiktok","instagram","todas"],
              estilo: ["caricatura","anime","3d","comic","ilustracion"],
              ritmo: ["2","3","5"],
              tesorero: ["s1","s2","s3"],
              impuestos: ["10","20","30","contador"],
              reinversion: ["10","20","30"],
              limite: ["0","15","30"],
              reunion: ["viernes","sabado","domingo"],
            };
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const reply = (body) => github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });

            const m = /```voto\s*\n([\s\S]*?)\n```/.exec(issue.body || "");
            let raw = null;
            try { raw = m ? JSON.parse(m[1]) : null; } catch (e) { raw = null; }
            if (!raw || typeof raw !== "object") {
              await reply("No encontré el voto en este texto. Vuelve a la página de la encuesta y toca **Guardar mi voto en GitHub** otra vez.");
              return;
            }
            const r = raw.respuestas && typeof raw.respuestas === "object" ? raw.respuestas : {};
            const respuestas = {};
            for (const [k, opts] of Object.entries(VALID)) {
              const v = r[k];
              if (k === "nicho") {
                const arr = [...new Set([].concat(v || []).filter(x => opts.includes(x)))].slice(0, 2);
                if (arr.length) respuestas[k] = arr;
              } else if (typeof v === "string" && opts.includes(v)) {
                respuestas[k] = v;
              }
            }
            const voto = {
              login: issue.user.login,
              nombre: String(raw.nombre || "").slice(0, 60),
              respuestas,
              comentario: String(raw.comentario || "").slice(0, 800),
              fecha: issue.updated_at || issue.created_at,
              issue: issue.number,
            };

            const path = "data/votos.json";
            for (let intento = 0; intento < 3; intento++) {
              let sha, lista = [];
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: context.payload.repository.default_branch });
                sha = data.sha;
                lista = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
                if (!Array.isArray(lista)) lista = [];
              } catch (e) { if (e.status !== 404) throw e; }
              lista = lista.filter(v => String(v.login).toLowerCase() !== voto.login.toLowerCase());
              lista.push(voto);
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, sha,
                  message: `Voto de ${voto.nombre || voto.login} (#${issue.number})`,
                  content: Buffer.from(JSON.stringify(lista, null, 2) + "\n").toString("base64"),
                  branch: context.payload.repository.default_branch,
                });
                break;
              } catch (e) {
                if (e.status !== 409 || intento === 2) throw e; // 409: otro voto llegó al mismo tiempo; reintentar
              }
            }
            const n = Object.keys(respuestas).length;
            await reply(`✅ Voto de **${voto.nombre || voto.login}** guardado (${n} de 10 respuestas). En un minuto aparece en la página de resultados.`);
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
